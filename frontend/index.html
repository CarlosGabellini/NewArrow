<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NewArrow</title>
  <link rel="stylesheet" href="./src/Css-like/style-index.css">
</head>
<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <h1 class="logo">NewArrow</h1>
        <span class="version">version 0.1(Alpha)</span>
      </div>

      <nav class="directories">
        <span class="directories-title">//SAVED DIRECTORIES</span>

        <!-- Injetando as dependecias do CSS aqui, onde vou colocar os diretorios!-->
        <ul class="directories-list"></ul>
      </nav>
      <div class="sidebar-bottom">
        <button class="config-btn">Config.</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="main-header">
        <div>
          <h2>Welcome, <span class="username">Host!</span></h2>
          <p class="subtitle">Already to play!</p>
        </div>
      </header>

      <section class="content">

        <!-- NOW PLAYING -->
        <div class="now-playing">
          <div class="cover">
            <img src="cover-placeholder.jpg" alt="Album cover">
          </div>
          <h3 class="track-title"></h3>
          <p class="track-artist"></p>
        </div>

        <div class="divider"></div>

        <!-- CENTER LANE -->
        <div class="center-lane">
          <h3 class="lane-title">Center lane</h3>

          <!-- As musicas vao ser injetadas aqui-->
          <ul class="track-list"></ul>
        </div>

      </section>
    </main>
  </div>

  <!-- PLAYER BAR -->
  <footer class="player-bar">
    <div class="player-bar-left">
      <button class="config-btn config-btn--footer">Config.</button>
    </div>

    <div class="player-bar-center">
      <div class="controls">
          <button class="control-btn" id="prevBtn">
            <img src="./src/buttons/beforehover.png" alt="prev">
          </button>
        
        <button class="control-btn control-btn--play" id="playBtn">
          <img src="./src/buttons/Button-play.png" alt="Play">
        </button>
        
        <button class="control-btn" id="nextBtn">
          <img src="./src/buttons/passhover.png" alt="Next">
        </button>
      </div>

      <div class="progress-row">
        <span class="time time--current"></span>
        <div class="progress-bar">
          <div class="progress-bar-fill"></div>
        </div>
        <span class="time time--total"></span>
      </div>
    </div>

    <div class="player-bar-right">
      <img src="src/icons/audio-waveform.png" id="audioWaveform" alt="Waveform"></img>
      <div class="volume-bar">
        <div class="volume-bar-fill" style="width: 0%;"></div>
      </div>
    </div>
  </footer>
  
  <script type="module" src="./src/JS/index-js.js"></script>
</body>
</html>
